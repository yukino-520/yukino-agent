<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1320" viewBox="0 0 1500 1320" role="img" aria-labelledby="title desc">
  <title id="title">AGI Yukino：Agent 编排与验收用例图</title>
  <desc id="desc">展示用户、角色 Agent、Agent Runtime 与工具系统在一轮请求中的职责，以及完成、等待确认、失败和降级等验收状态。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .actor-label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .domain-label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; }
      .case-label { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; text-anchor: middle; dominant-baseline: middle; }
      .small-label { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .state-label { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; dominant-baseline: middle; }
      .legend-label { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .normal-case { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .secondary-case { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .association { fill: none; stroke: #94a3b8; stroke-width: 2; }
      .include { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow-slate); }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1500" height="1320" fill="#f8fafc"/>
  <rect x="30" y="24" width="1440" height="76" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="58" y="61" class="title">模块 1 · Agent 编排与验收</text>
  <text x="58" y="86" class="subtitle">你在这里：路由决定谁来做，契约限制能做什么，工具回执证明做过什么，验收器决定是否完成</text>
  <rect x="1260" y="45" width="170" height="34" rx="17" fill="#dbeafe" stroke="#2563eb"/>
  <text x="1345" y="67" class="case-label" fill="#1d4ed8">当前学习模块</text>

  <!-- User actor -->
  <circle cx="76" cy="161" r="18" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <line x1="76" y1="179" x2="76" y2="226" stroke="#7c3aed" stroke-width="3"/>
  <line x1="51" y1="197" x2="101" y2="197" stroke="#7c3aed" stroke-width="3"/>
  <line x1="76" y1="226" x2="54" y2="258" stroke="#7c3aed" stroke-width="3"/>
  <line x1="76" y1="226" x2="98" y2="258" stroke="#7c3aed" stroke-width="3"/>
  <text x="76" y="284" class="actor-label">用户</text>

  <rect x="130" y="118" width="180" height="176" rx="18" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="220" y="194" class="domain-label">委托输入域</text>
  <text x="220" y="220" class="domain-label" opacity="0.78">Human Intent</text>
  <line x1="102" y1="206" x2="130" y2="206" class="association"/>

  <ellipse cx="470" cy="145" rx="120" ry="34" class="normal-case"/>
  <text x="470" y="145" class="case-label">提交自然语言委托</text>
  <ellipse cx="470" cy="215" rx="120" ry="34" class="normal-case"/>
  <text x="470" y="215" class="case-label">选择私聊 / 群像模式</text>
  <ellipse cx="470" cy="285" rx="120" ry="34" class="normal-case"/>
  <text x="470" y="285" class="case-label">确认高风险操作</text>
  <path d="M310 174 C330 165, 338 153, 350 145" class="association"/>
  <path d="M310 206 L350 215" class="association"/>
  <path d="M310 238 C330 250, 338 272, 350 285" class="association"/>

  <!-- Model / character agents -->
  <circle cx="76" cy="508" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <line x1="76" y1="526" x2="76" y2="573" stroke="#2563eb" stroke-width="3"/>
  <line x1="51" y1="544" x2="101" y2="544" stroke="#2563eb" stroke-width="3"/>
  <line x1="76" y1="573" x2="54" y2="605" stroke="#2563eb" stroke-width="3"/>
  <line x1="76" y1="573" x2="98" y2="605" stroke="#2563eb" stroke-width="3"/>
  <text x="76" y="631" class="actor-label">角色 Agent</text>

  <rect x="130" y="382" width="180" height="300" rx="18" fill="#2563eb" filter="url(#shadow)"/>
  <text x="220" y="519" class="domain-label">决策与观察域</text>
  <text x="220" y="545" class="domain-label" opacity="0.78">Model–Tool–Observe</text>
  <line x1="102" y1="532" x2="130" y2="532" class="association"/>

  <ellipse cx="470" cy="415" rx="120" ry="34" class="normal-case"/>
  <text x="470" y="415" class="case-label">选择角色与发言者</text>
  <ellipse cx="470" cy="495" rx="120" ry="34" class="normal-case"/>
  <text x="470" y="495" class="case-label">决定是否调用工具</text>
  <ellipse cx="470" cy="575" rx="120" ry="34" class="normal-case"/>
  <text x="470" y="575" class="case-label">读取工具观察继续推理</text>
  <ellipse cx="470" cy="655" rx="120" ry="34" class="normal-case"/>
  <text x="470" y="655" class="case-label">生成最终自然语言回复</text>
  <path d="M310 446 C330 432, 340 420, 350 415" class="association"/>
  <path d="M310 505 L350 495" class="association"/>
  <path d="M310 558 L350 575" class="association"/>
  <path d="M310 618 C330 635, 340 648, 350 655" class="association"/>

  <ellipse cx="760" cy="415" rx="118" ry="30" class="secondary-case"/>
  <text x="760" y="415" class="small-label">单角色 / 群像编排</text>
  <ellipse cx="760" cy="495" rx="118" ry="30" class="secondary-case"/>
  <text x="760" y="495" class="small-label">原生 Tool Calling</text>
  <ellipse cx="760" cy="575" rx="118" ry="30" class="secondary-case"/>
  <text x="760" y="575" class="small-label">role=tool 观察消息</text>
  <ellipse cx="760" cy="655" rx="118" ry="30" class="secondary-case"/>
  <text x="760" y="655" class="small-label">最终答案或澄清问题</text>
  <path d="M590 415 L642 415" class="include"/>
  <path d="M590 495 L642 495" class="include"/>
  <path d="M590 575 L642 575" class="include"/>
  <path d="M590 655 L642 655" class="include"/>

  <!-- Runtime -->
  <circle cx="76" cy="906" r="18" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <line x1="76" y1="924" x2="76" y2="971" stroke="#16a34a" stroke-width="3"/>
  <line x1="51" y1="942" x2="101" y2="942" stroke="#16a34a" stroke-width="3"/>
  <line x1="76" y1="971" x2="54" y2="1003" stroke="#16a34a" stroke-width="3"/>
  <line x1="76" y1="971" x2="98" y2="1003" stroke="#16a34a" stroke-width="3"/>
  <text x="76" y="1029" class="actor-label">Agent Runtime</text>

  <rect x="130" y="790" width="180" height="338" rx="18" fill="#16a34a" filter="url(#shadow)"/>
  <text x="220" y="946" class="domain-label">契约与验收域</text>
  <text x="220" y="972" class="domain-label" opacity="0.78">Plan–Authorize–Verify</text>
  <line x1="102" y1="959" x2="130" y2="959" class="association"/>

  <ellipse cx="470" cy="825" rx="120" ry="34" class="normal-case"/>
  <text x="470" y="818" class="case-label">生成执行计划</text>
  <text x="470" y="838" class="small-label">与证据契约</text>
  <ellipse cx="470" cy="915" rx="120" ry="34" class="normal-case"/>
  <text x="470" y="915" class="case-label">授权并执行工具</text>
  <ellipse cx="470" cy="1005" rx="120" ry="34" class="normal-case"/>
  <text x="470" y="998" class="case-label">根据真实回执</text>
  <text x="470" y="1018" class="small-label">验收任务状态</text>
  <ellipse cx="470" cy="1095" rx="120" ry="34" class="normal-case"/>
  <text x="470" y="1088" class="case-label">持久化任务 / 步骤</text>
  <text x="470" y="1108" class="small-label">事件与检查点</text>
  <path d="M310 842 C330 830, 340 826, 350 825" class="association"/>
  <path d="M310 918 L350 915" class="association"/>
  <path d="M310 1000 L350 1005" class="association"/>
  <path d="M310 1077 C330 1090, 340 1095, 350 1095" class="association"/>

  <ellipse cx="760" cy="825" rx="118" ry="30" class="secondary-case"/>
  <text x="760" y="818" class="small-label">allowed_actions</text>
  <text x="760" y="836" class="small-label">required_evidence</text>
  <ellipse cx="760" cy="915" rx="118" ry="30" class="secondary-case"/>
  <text x="760" y="908" class="small-label">权限检查 + 工具回执</text>
  <text x="760" y="926" class="small-label">失败 / 等待确认 / 成功</text>
  <ellipse cx="760" cy="1095" rx="118" ry="30" class="secondary-case"/>
  <text x="760" y="1088" class="small-label">task / step / event</text>
  <text x="760" y="1106" class="small-label">checkpoint</text>
  <path d="M590 825 L642 825" class="include"/>
  <path d="M590 915 L642 915" class="include"/>
  <path d="M590 1095 L642 1095" class="include"/>

  <!-- Verification states -->
  <path d="M590 1005 L630 1005" class="include"/>
  <ellipse cx="710" cy="975" rx="72" ry="25" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="710" y="975" class="state-label" fill="#166534">completed</text>
  <ellipse cx="875" cy="1005" rx="82" ry="25" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="875" y="1005" class="state-label" fill="#92400e">waiting</text>
  <ellipse cx="710" cy="1035" rx="72" ry="25" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="710" y="1035" class="state-label" fill="#991b1b">failed</text>
  <ellipse cx="875" cy="1065" rx="82" ry="25" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="875" y="1065" class="state-label" fill="#3730a3">degraded</text>

  <!-- Tool actor -->
  <rect x="1030" y="849" width="166" height="132" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2.5" filter="url(#shadow)"/>
  <path d="M1092 884 h42 l12 12 v36 h-54 z" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <path d="M1134 884 v14 h12" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="1113" y="953" class="actor-label">工具 / MCP</text>
  <path d="M878 915 L1030 915" class="association" marker-end="url(#arrow-green)"/>

  <!-- Main control flow -->
  <path d="M590 145 C970 145, 970 770, 590 825" class="flow"/>
  <text x="960" y="454" class="small-label">请求先形成边界</text>
  <path d="M590 915 C620 860, 620 560, 590 495" class="flow"/>
  <text x="640" y="736" class="small-label">只暴露获准工具</text>
  <path d="M878 575 C1000 600, 1000 970, 590 1005" class="flow"/>
  <text x="1008" y="771" class="small-label">观察与回执进入验收</text>

  <!-- Legend and takeaway -->
  <rect x="1218" y="126" width="232" height="312" rx="16" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="1242" y="158" class="actor-label" text-anchor="start">图例</text>
  <rect x="1242" y="179" width="30" height="20" rx="5" fill="#7c3aed"/>
  <text x="1286" y="194" class="legend-label">用户意图</text>
  <rect x="1242" y="215" width="30" height="20" rx="5" fill="#2563eb"/>
  <text x="1286" y="230" class="legend-label">模型决策</text>
  <rect x="1242" y="251" width="30" height="20" rx="5" fill="#16a34a"/>
  <text x="1286" y="266" class="legend-label">运行时约束</text>
  <ellipse cx="1257" cy="301" rx="15" ry="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1286" y="306" class="legend-label">完成</text>
  <ellipse cx="1257" cy="337" rx="15" ry="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="1286" y="342" class="legend-label">等待确认</text>
  <ellipse cx="1257" cy="373" rx="15" ry="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1286" y="378" class="legend-label">失败</text>
  <ellipse cx="1257" cy="409" rx="15" ry="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="1286" y="414" class="legend-label">降级</text>

  <rect x="1015" y="1120" width="435" height="136" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1040" y="1152" class="actor-label" text-anchor="start">关键边界</text>
  <text x="1040" y="1183" class="legend-label">模型负责提出动作与组织回复；</text>
  <text x="1040" y="1211" class="legend-label">运行时负责授权、执行、留痕和验收。</text>
  <text x="1040" y="1239" class="legend-label">“模型说完成”不能替代“工具证据已完成”。</text>

  <text x="50" y="1290" class="subtitle">AGI Yukino · Agent orchestration learning map · generated from repository structure</text>
</svg>
